<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIGR</title>
  <!-- Favicon - FIGR Flower Logo -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Vuetify for external form components -->
  <link href="https://cdn.jsdelivr.net/npm/vuetify@2.6.14/dist/vuetify.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body data-bs-theme="dark">
  <div id="app" class="container-fluid">
    <!-- 
      I want this index.html to be the orchestrated file calling the components.
      The page will show high-level workflow for bigger picture of the app.
      Ref: https://vuejs.org/guide/essentials/component-basics.html 
    -->
    <v-app>
    <!-- Header with navigation -->
    <header class="mb-2">
      <nav-bar 
        :is-logged-in="isLoggedIn" 
        :cart-count="cartCount"
        @go-to-home="currentView='home'"
        @go-to-profile="currentView='profile'"
        @go-to-login="currentView='login'"
        @go-to-cart="currentView='cart'"
        @logout="logout">
      </nav-bar>
    </header>

    <!-- Main content -->
    <main id="main">
      <!-- Home View -->
      <home-view 
        v-if="currentView==='home'"
        :products="products"
        :filters="filters"
        :sort-order="sortOrder"
        :categories="categories"
        :is-logged-in="isLoggedIn"
        :user="user"
        @add-to-cart="add"
        @update-filters="updateFilters"
        @update-sort-order="updateSortOrder">
      </home-view>
  
      <!-- Cart View -->
      <cart-view 
        v-if="currentView==='cart'"
        :cart="cart"
        :total="total"
        :gst="gst"
        :grand-total="grandTotal"
        :is-logged-in="isLoggedIn"
        :can-checkout="canCheckout"
        @inc-qty="incQty"
        @dec-qty="decQty"
        @remove-item="remove"
        @go-to-checkout="goToCheckout">
      </cart-view>

      <!-- Login View -->
      <login-view 
        v-if="currentView==='login'"
        :login-form="loginForm"
        @login="login"
        @go-to-home="goToHome"
        @go-to-register="goToRegister">
      </login-view>

      <!-- Register View -->
      <register-view 
        v-if="currentView==='register'"
        :register-form="registerForm"
        :valid="valid"
        :first-name-rules="firstNameRules"
        :last-name-rules="lastNameRules"
        :email-rules="emailRules"
        :username-rules="usernameRules"
        :password-rules="passwordRules"
        :confirm-password-rules-computed="confirmPasswordRulesComputed"
        @register="register"
        @go-to-home="goToHome"
        @go-to-login="goToLogin">
      </register-view>

      <!-- Profile View -->
      <profile-view 
        v-if="currentView==='profile'"
        :user="user"
        :order-history="orderHistory">
      </profile-view>

      <!-- Checkout View -->
      <checkout-view 
        v-if="currentView==='checkout'"
        :user="user"
        :cart="cart"
        :total="total"
        :gst="gst"
        :grand-total="grandTotal"
        @process-order="processOrder"
        @go-to-cart="goToCart">
      </checkout-view>
    </main>
    
    <!-- Footer -->
    <footer class="mt-5 py-3 text-center text-muted">
      <small>&copy; 2024 FIGR - Pop Mart Collection</small>
    </footer>
    </v-app>
  </div>

  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.6.14/dist/vuetify.min.js"></script>
  <script>
    // D6 formatting filter (display-only)
    Vue.filter('currency', function(n){
      return '$' + Number(n || 0).toFixed(2);
    });
    
    // Initialize Vuetify
    Vue.use(Vuetify);
  </script>
  <!-- Components (Reusable UI elements) -->
  <script src="components/custom-button.js"></script>
  <script src="components/nav-bar.js"></script>
  
  <!-- Views (Page-level components) -->
  <script src="views/home-view.js"></script>
  <script src="views/cart-view.js"></script>
  <script src="views/login-view.js"></script>
  <script src="views/register-view.js"></script>
  <script src="views/profile-view.js"></script>
  <script src="views/checkout-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
